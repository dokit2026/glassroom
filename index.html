<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GLASSROOM — 光をあつめる部屋</title><meta name="description" content="ガラスの違いを見つけて、あなただけの光の部屋へ。"><link rel="stylesheet" href="style.css"><body><canvas id="scene"></canvas><main id="intro"><p id="instruction" hidden></p><button id="open">OPEN</button></main><div id="hud" hidden><div class="top"><span id="timer">20<small> sec</small></span></div><p id="hint" hidden></p><button id="gyro">端末で見回す</button><button id="pause">一時停止</button><div id="stick" aria-label="室内を移動"><i></i></div><span class="move-label">WASD</span><span class="look-label">ドラッグで見回す · WASDで移動</span></div><div id="toast" role="status"></div><section id="finish" hidden aria-label="完成結果"><div class="result-card"><div class="result-stats"><strong id="rank">1<small>位</small></strong><span id="finish-time">00:00.0</span></div><p class="rank-scope">この展示端末の完成タイムランキング</p><form id="register"><label for="nickname">ニックネーム</label><div class="nickname-row"><input id="nickname" name="nickname" maxlength="16" required autocomplete="off" placeholder="16文字まで"><button id="save-score" type="submit">記録する</button></div><p id="save-status" role="status"></p></form><ol id="leaderboard" aria-label="ランキング"></ol><div class="result-actions"><button id="explore">部屋を眺める</button><button id="again">もう一度</button></div></div></section><script type="module" src="app.js"></script></body></html>
